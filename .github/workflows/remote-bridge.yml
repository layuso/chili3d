name: Test Chili3D Remote Browser Bridge

on:
  push:
    branches: [feature/remote-cad-bridge]
  pull_request:
    branches: [main]

jobs:
  browser-bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
